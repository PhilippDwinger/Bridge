name: CI

on:
  push:
    branches: [bridge-4]
  pull_request:
    branches: [bridge-4]

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # ADR 0011: TLS only with rustls + ring - aws-lc must never come in (on any target).
      - name: No aws-lc (ADR 0011)
        shell: bash
        run: |
          for crate in aws-lc-rs aws-lc-sys; do
            if out=$(cargo tree --workspace --target all -i "$crate" 2>&1); then
              echo "$crate is in the dependency tree (ADR 0011 forbids aws-lc):"
              echo "$out"
              exit 1
            fi
            if ! grep -q "did not match any packages" <<< "$out"; then
              echo "cargo tree failed:"
              echo "$out"
              exit 1
            fi
          done
      # Programs first, so the artifacts exist even when a test fails (Paddy can test meanwhile).
      - name: Build node program (release)
        run: cargo build --release -p bridge-node-bin
      - uses: actions/upload-artifact@v6
        with:
          name: bridge-node-${{ matrix.os }}
          path: |
            target/release/bridge-node
            target/release/bridge-node.exe
          if-no-files-found: ignore
      # BridgeControll v2 (ADR 0017): one program for the app and its node processes.
      - name: Build BridgeControll v2 (release)
        run: cargo build --release -p bridgecontroll
      - uses: actions/upload-artifact@v6
        with:
          name: bridgecontroll-${{ matrix.os }}
          path: |
            target/release/bridgecontroll
            target/release/bridgecontroll.exe
          if-no-files-found: error
      # All tests run (no fail-fast); failures are written as annotations so they can be read without signing in.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then exit 0; fi
          grep -aE "^---- |panicked at|^Error: |^test .* FAILED|error\[|assertion" test.log | head -60 | while IFS= read -r line; do
            echo "::error title=Test::${line}"
          done
          exit 1

      # Tests with real mDNS multicast are #[ignore = "needs multicast"]; Windows runners may block multicast.
      - name: Multicast tests (mDNS)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --ignored

  # SDKs in other languages (docs/10 §2, ADR 0021): shared vectors + live test against the Rust fixture.
  sdks:
    name: SDKs (Python, JavaScript, Java, Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vectors are up to date
        run: cargo test -p bridge-tests --test sdk_vectors
      - name: Build sdk-fixture
        run: cargo build -p bridge-tests --bin sdk-fixture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python SDK
        working-directory: sdk/python
        run: |
          pip install "cryptography>=41"
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: JavaScript SDK
        working-directory: sdk/javascript
        run: node --test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Java SDK
        run: bash sdk/java/run_tests.sh
      - name: Luau SDK (Lune 0.8.9)
        run: |
          curl -sSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          unzip -q lune.zip -d "$HOME/.lune" && chmod +x "$HOME/.lune/lune"
          echo "$HOME/.lune" >> "$GITHUB_PATH"
      - name: Luau tests
        run: bash sdk/luau/tests/run_tests.sh
