name: CI

on:
  push:
    branches: [bridge-4]
  pull_request:
    branches: [bridge-4]

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # ADR 0011: TLS only with rustls + ring - aws-lc must never come in (on any target).
      - name: No aws-lc (ADR 0011)
        shell: bash
        run: |
          for crate in aws-lc-rs aws-lc-sys; do
            if out=$(cargo tree --workspace --target all -i "$crate" 2>&1); then
              echo "$crate is in the dependency tree (ADR 0011 forbids aws-lc):"
              echo "$out"
              exit 1
            fi
            if ! grep -q "did not match any packages" <<< "$out"; then
              echo "cargo tree failed:"
              echo "$out"
              exit 1
            fi
          done
      - run: cargo test --workspace
      # Tests with real mDNS multicast are #[ignore = "needs multicast"]; Windows runners may block multicast.
      - name: Multicast tests (mDNS)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --ignored
      - name: Build node program (release)
        run: cargo build --release -p bridge-node-bin
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-node-${{ matrix.os }}
          path: |
            target/release/bridge-node
            target/release/bridge-node.exe
          if-no-files-found: ignore
      # BridgeControll v2 (ADR 0017): one program for the app and its node processes.
      - name: Build BridgeControll v2 (release)
        run: cargo build --release -p bridgecontroll
      - uses: actions/upload-artifact@v4
        with:
          name: bridgecontroll-${{ matrix.os }}
          path: |
            target/release/bridgecontroll
            target/release/bridgecontroll.exe
          if-no-files-found: error
