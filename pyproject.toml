[project]
name = "bridge"
version = "3.0.0"
description = "Universal communication layer for connecting programs and systems"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "argon2-cffi",
    "httpx",
    "cryptography"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
