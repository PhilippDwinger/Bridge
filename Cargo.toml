[workspace]
resolver = "3"
members = [
    "crates/bridge-core",
    "crates/bridge-store",
    "crates/bridge-transport",
    "crates/bridge-guard",
    "crates/bridge-net",
    "crates/bridge-plugin-api",
    "crates/bridge-node",
    "bin/bridge-node",
    "sdk/rust",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/PhilippDwinger/Bridge"
authors = ["Philipp Dwinger"]

# Zero Trust in code: no unsafe anywhere (docs/00_GRUNDSAETZE.md, Z10 / ADR 0003).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# One place for internal crate paths: layers are enforced by which crate lists which dependency.
[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
bridge-store = { path = "crates/bridge-store" }
bridge-transport = { path = "crates/bridge-transport" }
bridge-guard = { path = "crates/bridge-guard" }
bridge-net = { path = "crates/bridge-net" }
bridge-plugin-api = { path = "crates/bridge-plugin-api" }
bridge-node = { path = "crates/bridge-node" }
bridge-sdk = { path = "sdk/rust" }

# External crates (versions in one place). Crypto: RustCrypto / dalek only (docs/02 §4, rule Z10).
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
base64 = "0.22"
serde = "1"
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "fs", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
