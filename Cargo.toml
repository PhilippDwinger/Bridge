[workspace]
resolver = "3"
members = [
    "crates/bridge-core",
    "crates/bridge-store",
    "crates/bridge-transport",
    "crates/bridge-guard",
    "crates/bridge-net",
    "crates/bridge-plugin-api",
    "crates/bridge-wasm",
    "crates/bridge-node",
    "crates/bridge-gate",
    "services/ai",
    "bin/bridge-node",
    "apps/bridgecontroll",
    "sdk/rust",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/PhilippDwinger/Bridge"
authors = ["Philipp Dwinger"]

# Zero Trust in code: no unsafe anywhere (docs/00_GRUNDSAETZE.md, Z10 / ADR 0003).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# One place for internal crate paths: layers are enforced by which crate lists which dependency.
[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
bridge-store = { path = "crates/bridge-store" }
bridge-transport = { path = "crates/bridge-transport" }
bridge-guard = { path = "crates/bridge-guard" }
bridge-net = { path = "crates/bridge-net" }
bridge-plugin-api = { path = "crates/bridge-plugin-api" }
bridge-wasm = { path = "crates/bridge-wasm" }
bridge-node = { path = "crates/bridge-node" }
bridge-gate = { path = "crates/bridge-gate" }
bridge-sdk = { path = "sdk/rust" }
bridge-ai = { path = "services/ai" }
# The node program as a library (its node runner and commands), for BridgeControll (ADR 0017).
bridge-node-cli = { path = "bin/bridge-node", package = "bridge-node-bin" }

# External crates (versions in one place). Crypto: RustCrypto / dalek only (docs/02 §4, rule Z10).
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# BIP-39 recovery words (docs/06 §1): rust-bitcoin's crate, English word list only, secrets wiped on drop.
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
base64 = "0.22"
# Sandbox for foreign code (ADR 0020): a pure Rust interpreter with fuel metering; `wat` only for tests.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "deterministic", "auto-dispatch"] }
wat = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "fs", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http-body-util = "0.1"
http = "1"
bytes = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# LAN transport (ADR 0004, docs/06 §2): pinned TLS on rustls with the ring provider only (never aws-lc),
# self-signed node certificates (rcgen), discovery hints via mDNS/DNS-SD.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "zeroize"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
# `net rescue`: the terminal echo off while the 24 words are typed (safe termios API; already in the tree via
# tempfile). Only the binary uses it, only on Unix.
rustix = { version = "1", default-features = false, features = ["std", "termios", "process"] }
# BridgeControll (ADR 0017): QR codes of join links, pure Rust without dependencies (rendered to SVG by the app).
qrcodegen = "1.8"
# BridgeControll (review 8): the single-instance lock (flock / LockFileEx through rustix / windows-sys, no own unsafe;
# std's File::lock needs Rust 1.89, the MSRV is 1.85).
fs4 = { version = "1", default-features = false, features = ["sync"] }

# Tests verify many signatures; unoptimized curve arithmetic makes each check ~10 ms in debug builds. Optimize only
# these crypto dependencies in dev/test builds (Bridge's own code and release builds are unchanged).
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
